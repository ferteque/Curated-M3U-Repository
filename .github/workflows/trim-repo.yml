name: Trim Repo
on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:
jobs:
  trim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
        with:
          fetch-depth: 0
      - name: Configure Git
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
      - name: Trim via GitHub API
        shell: bash
        env:
          DRY_RUN: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          declare -A seen_commits
          while IFS= read -r file; do
            FILE_COUNT=$(git log --format="%H" -- "$file" | wc -l)
            if [ "$FILE_COUNT" -le 50 ]; then
              continue
            fi
            COMMIT=$(git log -n 50 --format="%H" -- "$file" | tail -n 1)
            if [ -n "$COMMIT" ]; then
              seen_commits["$COMMIT"]=1
            fi
          done < <(git ls-files)

          if [ ${#seen_commits[@]} -eq 0 ]; then
            echo "No files with more than 50 commits found. Nothing to trim."
            exit 0
          fi

          CUTOFF=""
          for commit in "${!seen_commits[@]}"; do
            if [ -z "$CUTOFF" ]; then
              CUTOFF="$commit"
            else
              if git merge-base --is-ancestor "$commit" "$CUTOFF"; then
                CUTOFF="$commit"
              fi
            fi
          done

          echo "Cutoff commit: $CUTOFF"
          echo "Cutoff commit message: $(git log -1 --format='%s' $CUTOFF)"
          echo "Cutoff commit date: $(git log -1 --format='%ci' $CUTOFF)"

          PARENTS=$(git rev-list --parents -n 1 "$CUTOFF" | awk '{print NF-1}')
          if [ "$PARENTS" -eq 0 ]; then
            echo "Cutoff is already root. Nothing to trim."
            exit 0
          fi

          COMMITS_TO_DROP=$(git rev-list "$CUTOFF"^ | wc -l)
          COMMITS_TO_KEEP=$(git rev-list "$CUTOFF"..HEAD | wc -l)
          echo "Commits that would be dropped: $COMMITS_TO_DROP"
          echo "Commits that would be kept: $COMMITS_TO_KEEP"

          echo ""
          echo "File history after trim:"
          while IFS= read -r file; do
            KEPT=$(git log --format="%H" "$CUTOFF"..HEAD -- "$file" | wc -l)
            if [ "$KEPT" -eq 0 ]; then
              echo "  $file -> no commits after cutoff (exists in root snapshot only)"
            else
              set +o pipefail
              OLDEST=$(git log --reverse --format="%ci" "$CUTOFF"..HEAD -- "$file" | head -n 1)
              set -o pipefail
              echo "  $file -> $KEPT commits kept, oldest: $OLDEST"
            fi
          done < <(git ls-files)

          if [ "$DRY_RUN" = "true" ]; then
            echo ""
            echo "DRY RUN — no changes pushed."
            exit 0
          fi

          API="https://api.github.com/repos/${{ github.repository }}"
          AUTH="Authorization: Bearer $GH_TOKEN"

          CUTOFF_TREE=$(git rev-parse "$CUTOFF^{tree}")
          echo "Creating root commit via API..."
          NEWROOT=$(curl -sf -X POST "$API/git/commits" \
            -H "$AUTH" -H "Content-Type: application/json" \
            -d "{\"message\":\"History trimmed (retaining at least 50 versions per file)\",\"tree\":\"$CUTOFF_TREE\",\"parents\":[]}" \
            | jq -r '.sha')
          echo "New root: $NEWROOT"

          PARENT=$NEWROOT
          mapfile -t COMMITS < <(git log --reverse --format="%H" "$CUTOFF"..HEAD)
          TOTAL=${#COMMITS[@]}
          COUNT=0
          for COMMIT in "${COMMITS[@]}"; do
            COUNT=$((COUNT + 1))
            TREE=$(git rev-parse "$COMMIT^{tree}")
            MSG=$(git log -1 --format="%s" "$COMMIT")
            AUTHOR_NAME=$(git log -1 --format="%an" "$COMMIT")
            AUTHOR_EMAIL=$(git log -1 --format="%ae" "$COMMIT")
            AUTHOR_DATE=$(git log -1 --format="%aI" "$COMMIT")
            PAYLOAD=$(jq -n \
              --arg msg "$MSG" \
              --arg tree "$TREE" \
              --arg parent "$PARENT" \
              --arg aname "$AUTHOR_NAME" \
              --arg aemail "$AUTHOR_EMAIL" \
              --arg adate "$AUTHOR_DATE" \
              '{message:$msg,tree:$tree,parents:[$parent],author:{name:$aname,email:$aemail,date:$adate}}')
            PARENT=$(curl -sf -X POST "$API/git/commits" \
              -H "$AUTH" -H "Content-Type: application/json" \
              -d "$PAYLOAD" | jq -r '.sha')
            echo "Created commit $COUNT/$TOTAL: $PARENT"
          done

          echo "Updating main ref to $PARENT..."
          curl -sf -X PATCH "$API/git/refs/heads/main" \
            -H "$AUTH" -H "Content-Type: application/json" \
            -d "{\"sha\":\"$PARENT\",\"force\":true}"
          echo "Done. Zero bytes uploaded."
